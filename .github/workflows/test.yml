name: test

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit and flow tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test

  vscode:
    name: integration tests in a real VS Code (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libasound2t64 libnss3
      - run: npm ci
      - run: npm run compile
      - run: xvfb-run -a npm run test:vscode
